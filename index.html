<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Traffic Gateway</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #ffd700;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: linear-gradient(135deg, #261400 0%, #0d0600 100%);
            border: 2px solid #d4af37;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #422600;
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // तेरा ShrinkMe शॉर्ट लिंक यहाँ पर ऑटो-लोडेड है
        const targetLink = "https://shrinkme.click/0bL11Qz5";

        window.onload = function() {
            // नेचुरल इंसानों की तरह ट्रैफिक पास करने के लिए 1.2 सेकंड का डिले रखा है
            setTimeout(function() {
                window.location.replace(targetLink);
            }, 1200);
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h3>Loading Gateway...</h3>
        <p style="font-size: 12px; color: #d4af37; margin-top: 8px;">Please wait while connection is established.</p>
    </div>
</body>
</html>
